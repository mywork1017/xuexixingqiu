<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>地图页 PRD 目标 HTML</title>
    <link rel="stylesheet" href="./reference.css" />
    <style>
      .map-phone {
        background: #081111;
      }

      .map-header {
        height: 138px;
        left: 0;
        padding: 58px 10px 0;
        position: absolute;
        right: 0;
        top: 0;
        z-index: 8;
      }

      .map-title {
        color: #f1dfbd;
        font-size: 25px;
        font-weight: 500;
        letter-spacing: 2px;
        margin: 0 0 24px;
        text-align: center;
      }

      .filters {
        display: flex;
        gap: 8px;
        overflow: hidden;
        padding: 0 8px;
      }

      .filter {
        align-items: center;
        background: rgba(22, 22, 18, 0.68);
        border: 1px solid rgba(186, 143, 61, 0.35);
        border-radius: 18px;
        color: #f3e6cd;
        display: flex;
        flex: 0 0 auto;
        font: 600 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        gap: 8px;
        height: 30px;
        padding: 0 12px;
      }

      .filter.active {
        background: rgba(45, 93, 54, 0.7);
        border-color: rgba(118, 201, 127, 0.78);
      }

      .dot {
        border-radius: 50%;
        height: 9px;
        width: 9px;
      }

      .map-canvas {
        background-image: linear-gradient(rgba(4, 12, 14, 0.5), rgba(4, 12, 14, 0.5)), url("./assets/mock-map-bg.png");
        background-position: center top;
        background-size: cover;
        bottom: 86px;
        left: 0;
        position: absolute;
        right: 0;
        top: 136px;
      }

      .pin {
        align-items: center;
        color: #f4ead8;
        display: flex;
        flex-direction: column;
        font: 700 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        gap: 4px;
        position: absolute;
        text-align: center;
        text-shadow: 0 2px 7px rgba(0, 0, 0, 0.86);
      }

      .pin-bubble {
        align-items: center;
        background: var(--c);
        border: 2px solid rgba(255, 230, 175, 0.55);
        border-radius: 50% 50% 50% 6px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.42);
        display: flex;
        height: 36px;
        justify-content: center;
        transform: rotate(-45deg);
        width: 36px;
      }

      .pin-bubble span {
        font-size: 18px;
        transform: rotate(45deg);
      }

      .pin.featured .pin-bubble {
        height: 54px;
        width: 54px;
      }

      .pin small {
        color: #c7bba9;
        display: block;
        font-size: 12px;
        font-weight: 500;
        margin-top: 2px;
      }

      .locate {
        align-items: center;
        background: rgba(89, 111, 65, 0.58);
        border-radius: 50%;
        bottom: 304px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
        color: #fff7df;
        display: flex;
        font-size: 30px;
        height: 56px;
        justify-content: center;
        position: absolute;
        right: 35px;
        width: 56px;
      }

      .place-card {
        background: linear-gradient(135deg, rgba(251, 246, 234, 0.98), rgba(232, 218, 193, 0.94));
        border-radius: 22px;
        bottom: 78px;
        box-shadow: 0 16px 38px rgba(0, 0, 0, 0.34);
        color: #292822;
        left: 10px;
        min-height: 220px;
        padding: 24px 18px 18px;
        position: absolute;
        right: 10px;
      }

      .card-main {
        display: grid;
        gap: 6px;
        grid-template-columns: 78px 1fr;
      }

      .store-icon {
        align-items: center;
        background: radial-gradient(circle, #1e3d28, #10261a);
        border: 1px solid rgba(232, 196, 125, 0.38);
        border-radius: 50%;
        color: #e8c47d;
        display: flex;
        font-size: 28px;
        height: 66px;
        justify-content: center;
        width: 66px;
      }

      .place-name {
        font-size: 28px;
        font-weight: 500;
        margin: 0 0 8px;
      }

      .meta {
        align-items: center;
        color: #4a4236;
        display: flex;
        font: 16px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        gap: 8px;
        margin: 7px 0;
      }

      .tag-row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }

      .tag {
        background: rgba(218, 199, 165, 0.42);
        border: 1px solid rgba(155, 123, 75, 0.2);
        border-radius: 9px;
        color: #5f513d;
        font: 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        padding: 5px 10px;
      }

      .distance {
        color: #5f513d;
        font: 16px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        position: absolute;
        right: 30px;
        top: 112px;
      }

      .divider {
        background: rgba(139, 111, 70, 0.26);
        height: 1px;
        margin: 18px 0 15px;
      }

      .actions {
        display: grid;
        gap: 13px;
        grid-template-columns: 1fr 1fr 1fr;
      }

      .action {
        align-items: center;
        background: rgba(210, 195, 170, 0.48);
        border-radius: 10px;
        color: #302d28;
        display: flex;
        font: 600 20px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        gap: 10px;
        height: 44px;
        justify-content: center;
      }

      .action.primary {
        background: linear-gradient(135deg, #0b351f, #122a1b);
        color: #fff0d4;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <p class="label">地图页 PRD 目标 HTML</p>
      <section class="phone map-phone">
        <div class="status"><span>9:41</span><span class="signal">▮▮▮  WiFi  ▭</span></div>
        <div class="capsule"><span>•••</span><span class="capsule-ring"></span></div>

        <header class="map-header">
          <h1 class="map-title">上海学习地图</h1>
          <div class="filters">
            <div class="filter active">全部</div>
            <div class="filter"><span class="dot" style="background:#4d9e58"></span>图书馆</div>
            <div class="filter"><span class="dot" style="background:#d5a74e"></span>书店</div>
            <div class="filter"><span class="dot" style="background:#4c75df"></span>自习室</div>
            <div class="filter"><span class="dot" style="background:#d85b44"></span>党群服务中心</div>
            <div class="filter"><span class="dot" style="background:#9aaa55"></span>社区食堂</div>
          </div>
        </header>

        <div class="map-canvas">
          <div class="pin" style="--c:#8f9a46;left:56px;top:150px;"><div class="pin-bubble"><span>☕</span></div><b>静安社区食堂</b><small>静安区胶州路343号</small></div>
          <div class="pin" style="--c:#577d4b;left:178px;top:220px;"><div class="pin-bubble"><span>▮</span></div><b>上海图书馆东馆</b><small>浦东新区合欢路300号</small></div>
          <div class="pin" style="--c:#536ed6;right:62px;top:90px;"><div class="pin-bubble"><span>♟</span></div><b>五角场自习室</b><small>杨浦区邯郸路600号</small></div>
          <div class="pin" style="--c:#b34e3b;right:60px;top:330px;"><div class="pin-bubble"><span>●</span></div><b>浦东新区<br/>党群服务中心</b><small>浦东新区锦绣东路81号</small></div>
          <div class="pin" style="--c:#c59a3b;left:58px;bottom:154px;"><div class="pin-bubble"><span>▣</span></div><b>徐家汇书院</b><small>徐汇区漕溪北路158号</small></div>
          <div class="pin featured" style="--c:#c79b3c;left:168px;bottom:128px;"><div class="pin-bubble"><span>▣</span></div><b>思南书局</b><small>黄浦区复兴中路517号</small></div>
          <div class="locate">◎</div>
        </div>

        <section class="place-card">
          <div class="card-main">
            <div class="store-icon">▣</div>
            <div>
              <h2 class="place-name">思南书局</h2>
              <p class="meta">⌖ 黄浦区复兴中路517号</p>
              <p class="meta">◷ 10:00–21:00　营业中</p>
              <div class="tag-row"><span class="tag">阅读</span><span class="tag">人文</span></div>
            </div>
          </div>
          <div class="distance">1.8 公里</div>
          <div class="divider"></div>
          <div class="actions">
            <div class="action primary">➤ 导航</div>
            <div class="action">▤ 详情</div>
            <div class="action">☆ 收藏</div>
          </div>
        </section>

        <nav class="tabbar">
          <div class="tab active"><span class="tab-mark">▰</span><span>地图</span></div>
          <div class="tab"><span class="tab-mark">♙</span><span>我的</span></div>
        </nav>
      </section>
    </main>
  </body>
</html>
